name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm docs:build

      - name: Verify Build Output
        run: |
          if [ ! -d "./docs/.vitepress/dist" ]; then
            echo "Error: ./docs/.vitepress/dist does not exist after build."
            ls -la ./docs/.vitepress/
            exit 1
          fi
          echo "Build output verified."

      - name: Package
        run: node scripts/pack-dist.js

      - name: Verify Zip Archive
        run: |
          if [ ! -f "./docs/.vitepress/dist.zip" ]; then
            echo "Error: ./docs/.vitepress/dist.zip was not created."
            ls -la ./docs/.vitepress/
            exit 1
          fi
          echo "Zip archive created successfully."

      - name: Upload to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "./docs/.vitepress/dist.zip"
          target: "/tmp/"

      - name: Deploy
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            unzip -o /tmp/dist.zip
            rm /tmp/dist.zip
            echo "Deployment completed successfully."