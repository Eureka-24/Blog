name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm docs:build

      - name: Verify Build Output
        run: |
          if [ ! -d "./docs/.vitepress/dist" ]; then
            echo "Error: ./docs/.vitepress/dist does not exist after build."
            ls -la ./docs/.vitepress/
            exit 1
          fi
          echo "Build output verified."

      - name: Package
        run: node scripts/pack-dist.js

      - name: Verify Zip Archive
        run: |
          if [ ! -f "./docs/.vitepress/dist.zip" ]; then
            echo "Error: ./docs/.vitepress/dist.zip was not created."
            ls -la ./docs/.vitepress/
            exit 1
          fi
          echo "Zip archive created successfully."

      - name: Upload to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "./docs/.vitepress/dist.zip"
          target: "/tmp/"

      - name: Check Server /tmp/
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            echo "=== /tmp/ 目录内容 ==="
            ls -la /tmp/

      - name: Check Deploy Path
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            echo "=== 部署路径: ${{ secrets.DEPLOY_PATH }} ==="
            if [ -d "${{ secrets.DEPLOY_PATH }}" ]; then
              ls -la ${{ secrets.DEPLOY_PATH }}
            else
              echo "目录不存在!"
              mkdir -p ${{ secrets.DEPLOY_PATH }}
              echo "已创建目录"
            fi

      - name: Deploy
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "=== 解压前 ==="
            ls -la
            echo "=== 解压 ==="
            unzip -o /tmp/dist.zip || echo "unzip failed!"
            echo "=== 解压后 ==="
            ls -la
            rm /tmp/dist.zip
            echo "Deployment completed."