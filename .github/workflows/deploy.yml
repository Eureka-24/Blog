name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm docs:build

      # 【新增】验证构建产物是否存在
      - name: Verify Build Output
        run: |
          if [ ! -d "./docs/.vitepress/dist" ]; then
            echo "Error: ./docs/.vitepress/dist does not exist after build."
            ls -la ./docs/.vitepress/ # 列出目录以供调试
            exit 1
          fi
          echo "Build output verified."

      - name: Package
        run: node scripts/pack-dist.js

      # 【新增】验证压缩包是否存在
      - name: Verify Zip Archive
        run: |
          if [ ! -f "./docs/.vitepress/dist.zip" ]; then
            echo "Error: ./docs/.vitepress/dist.zip was not created."
            ls -la ./docs/.vitepress/ # 列出目录以供调试
            exit 1
          fi
          echo "Zip archive created successfully."

      - name: Upload to Server
        uses: appleboy/scp-action@v0.1.7 # 使用固定版本而非 master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }} # 【改进】使用密钥而非密码
          source: "./docs/.vitepress/dist.zip"
          target: "/tmp/"
          strip_components: 3 # 可选：从路径中移除 components，确保上传的是文件本身

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.0 # 使用固定版本而非 master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }} # 【改进】使用密钥而非密码
          script: |
            set -e # 遇到错误时立即退出
            cd ${{ secrets.DEPLOY_PATH }}
            # 备份旧文件（可选）
            # cp -r . /tmp/backup_$(date +%s)
            
            # 解压并清理
            unzip -o /tmp/dist.zip
            rm /tmp/dist.zip
            
            echo "Deployment completed successfully on $(date)."